# C-LS (POST-TEST exploration, option 1): C-full + LLM listwise selection over the top-8 provisions (select-v1),
# picks (<= 2) moved to the top under the pinned exact hits. Designed after the test split was spent.
name: C-LS
retrieve:
  bm25: {k: 300, weight: 1.0}
  dense: {model: qwen3-0.6b, k: 300, weight: 1.0}
metadata:
  act_bm25: {k: 100, weight: 1.0}
  exact_ref: {weight: 2.0}
  jur_bm25: {k: 100, weight: 0.5}
abstain:
  missing_provision: true
  unresolved_law: true
  rerank_threshold: 0.041   # tuned on dev traces: max(abst - 2*false), false <= 5%  (dev: 1.000 / 0.030)
rerank: {model: bge-reranker-v2-m3, depth: 100, pin_exact: true}
fusion: {k: 60}
pack: {min_piece: 200}
planc:
  xref: {mode: post, m: 3, max_per: 2, incoming: true, multipart_only: true, part_scores: true, min_ce: 0.041}
llm: {model: qwen3:8b, select: {candidates: 8, snippet: 220, max_pick: 2}}
answer: {mode: llm, passages: 8, chars: 2500}
